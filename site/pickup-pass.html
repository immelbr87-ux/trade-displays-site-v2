<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pickup Pass • Showroom Market</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/market.html">
          <div class="brand-mark">S</div>
          <div class="brand-text">
            <div class="brand-name">Showroom Market</div>
            <div class="brand-sub">Verified Pickup Marketplace</div>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main class="section" style="max-width: 900px;">
    <div class="card">
      <h2 style="margin-bottom: 8px;">Pickup Pass</h2>
      <p id="subtitle" style="margin-bottom: 18px;">Show this to the showroom at pickup.</p>

      <div style="display:flex; justify-content:center; padding: 16px; background:#fff; border:1px solid var(--border); border-radius: 12px;">
        <canvas id="qrCanvas" width="320" height="320"></canvas>
      </div>

      <div class="alert alert-success" style="margin-top: 16px;">
        The showroom must confirm acceptance after inspection. Once confirmed, payout unlocks after the hold window.
      </div>

      <div style="margin-top: 16px; display:flex; gap: 10px; flex-wrap: wrap;">
        <a class="btn btn-outline" href="/pickup-scan.html">Showroom Scan Page</a>
        <a class="btn btn-primary" href="/market.html">Back to Market</a>
      </div>
    </div>
  </main>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const listingId = qs.get("listingId");
  const payload = qs.get("qr") || (listingId ? btoa(JSON.stringify({listingId})) : "");
  const subtitle = document.getElementById("subtitle");

  if(!payload){
    subtitle.textContent = "Missing pickup data. Open this from your success page or receipt.";
    return;
  }
  if(listingId){
    subtitle.textContent = `Listing ID: ${listingId}. Show this to the showroom at pickup.`;
  }
  const canvas = document.getElementById("qrCanvas");
  QRCode.toCanvas(canvas, payload, { width: 320, margin: 1 }, function (error) {
    if (error) console.error(error);
  });
})();
</script>
</body>
</html>
