<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Revenue Dashboard — Showroom Market</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="admin-container">
    <h1>💰 Revenue Dashboard</h1>

    <div class="stats-grid admin-stats">
      <div class="stat-card">
        <span class="stat-label">Total GMV</span>
        <span class="stat-value" id="stat-gmv">$0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Platform Revenue</span>
        <span class="stat-value" id="stat-revenue">$0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Avg Take Rate</span>
        <span class="stat-value" id="stat-take-rate">0%</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Orders</span>
        <span class="stat-value" id="stat-orders">0</span>
      </div>
    </div>

    <div class="card mt-4">
      <h3>📈 Revenue Over Time</h3>
      <canvas id="revenueChart" height="120"></canvas>
    </div>

    <div class="card mt-4">
      <h3>🧮 Commission Breakdown</h3>
      <canvas id="commissionChart" height="120"></canvas>
    </div>
  </div>

  <script src="/admin-revenue-dashboard.js"></script>
</body>
</html>
