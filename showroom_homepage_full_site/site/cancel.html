<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout Canceled • Showroom Market</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="site-header">
    <div class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/market.html">
          <div class="brand-mark">S</div>
          <div class="brand-text">
            <div class="brand-name">Showroom Market</div>
            <div class="brand-sub">Verified Pickup Marketplace</div>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main class="section" style="max-width: 900px;">
    <div class="card">
      <div class="badge badge-warning" style="display:inline-block; margin-bottom: 16px;">Checkout Canceled</div>
      <h2 style="margin-bottom: 8px;">No worries — you weren't charged.</h2>
      <p style="margin-bottom: 18px;">You can return to the listing and try again when you're ready.</p>
      <div style="display:flex; gap: 12px; flex-wrap: wrap;">
        <a id="backToListing" class="btn btn-primary" href="/market.html">Back to Listing</a>
        <a class="btn btn-outline" href="/market.html">Browse Market</a>
      </div>
    </div>
  </main>
<script>
  (function(){
    const qs = new URLSearchParams(location.search);
    const id = qs.get("listingId");
    const link = document.getElementById("backToListing");
    if(id) link.href = `/listing-details.html?id=${encodeURIComponent(id)}`;
  })();
</script>
</body>
</html>
